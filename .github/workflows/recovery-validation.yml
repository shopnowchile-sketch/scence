name: Recovery validation

# Pausado temporalmente para detener notificaciones por cada commit.
# Ejecutar manualmente una única vez después de corregir y revisar los fallos.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
