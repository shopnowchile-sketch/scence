name: Recovery validation

# Evita una ejecución y un correo por cada commit de código.
# Se activa manualmente o al cambiar este workflow para una validación controlada.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/recovery-validation.yml"

permissions:
  contents: read

concurrency:
  group: recovery-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
